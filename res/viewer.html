<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Preview</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/abcjs@6.6.0/abcjs-audio.css">
    <style>
        @import url(https://fonts.googleapis.com/css?family=Itim);

        @font-face {
            font-family: 'itim-music';
            src: url('https://paulrosen.github.io/abcjs/fonts/itim-music.ttf') format('truetype'),
                url('https://paulrosen.github.io/abcjs/fonts/itim-music.woff') format('woff'),
                url('https://paulrosen.github.io/abcjs/fonts/itim-music.svg#icomoon') format('svg');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --abcjs-highlight-color: #0a9ecc;
            --abcjs-cursor-color: #ff0000;
        }

        h1 {
            margin: 0;
            padding: 0;
            flex-grow: 2;
        }

        .top {
            display: flex;
            align-items: flex-top;
            column-gap: 10px;
            justify-content: space-between;
        }

        .options {
            display: flex;
            flex-direction: column;
            margin-bottom: .5em;
            flex-shrink: 2;
            row-gap: 5px;
            border: 1px dotted #888;
        }

        .options>* {
            display: block;
        }

        .width-label {
            width: 80px;
            display: inline-block;
        }

        .highlight {
            fill: var(--abcjs-highlight-color);
        }

        .abcjs-cursor {
            stroke: var(--abcjs-cursor-color);
        }

        #source {
            display: none;
        }

        #source.show {
            display: block;
            border: 1px dotted #888;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="top">
        <label id="tune-selector">
            <span class="width-label">Tune:</span><select></select>
        </label>
    </div>

    <div id="source"></div>
    <div id="paper"></div>
    <div id="audio"></div>

    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.6.0/dist/abcjs-basic-min.js"></script>
    <script>
        let vscode = null;
        if (window.acquireVsCodeApi) {
            vscode = acquireVsCodeApi();
        }

        var extensionOptions = JSON.parse(`{extensionConfiguration}`);
        var defaultOptions = {
            startingTune: 0,
            clickListener: clickListener,
            responsive: "resize",
            format: {
                gchordfont: '"itim-music,Itim" 20'
            },
        }
        var options = Object.assign({}, defaultOptions, extensionOptions);

        var abc = `{editorContent}`;

        function applyAudioOptions() {
            if (options.audioCursorColor)
                document.documentElement.style.setProperty("--abcjs-cursor-color", options.audioCursorColor);
            if (options.audioHighlightColor)
                document.documentElement.style.setProperty("--abcjs-highlight-color", options.audioHighlightColor);
            document.getElementById("audio").style.display = options.audioEnabled === false ? "none" : "";
        }

        function optionChanged() {
            reload();
        }


        function playNote(abcElem, millisecondsPerMeasure) {
            var lastClicked = abcElem.midiPitches;
            if (!lastClicked)
                return;

            if (options.playSelectedNotes) {
                ABCJS.synth.playEvent(
                    lastClicked,
                    abcElem.midiGraceNotePitches,
                    millisecondsPerMeasure
                )
            }
        }

        /**
         * Run abcjs, render the score from ABC notation.
         */
        var visualObj
        function drawTune(abcCode) {
            visualObj = ABCJS.renderAbc('paper', abcCode, options)[0];
            if (options.audioEnabled !== false) visualObj.setUpAudio();

            const showSource = options.showTransposedSource;
            const source = document.getElementById("source");

            const transposition = parseInt(options.visualTranspose, 10)

            if (showSource && transposition) {
                const tuneBook = new ABCJS.TuneBook(abcCode);

                const tune = tuneBook.tunes[options.startingTune];
                if (tune) {
                    const visualObj = ABCJS.renderAbc("*", tune.pure);
                    source.classList.add("show");
                    const output = ABCJS.strTranspose(tune.pure, visualObj, transposition);
                    source.innerText = output;
                }
            } else {
                source.classList.remove("show");
            }
        }

        function setTune(userAction) {
            if (synthControl) {
                synthControl.pause();
                synthControl.disable(true);
            }
            options.startingTune = select.value
            drawTune(abc)
            if (options.audioEnabled !== false && synthControl && visualObj) {
                synthControl.setTune(visualObj, userAction)
            }
        }

        function reload() {
            setTune(true)
        }

        // todo: rearrange this to not sit in the global namespace.
        var select = document.querySelector("#tune-selector select");
        select.addEventListener("change", load);

        /**
         * Read tunes from the abc content
         */
        function analyzeContent(abcCode) {
            var tuneBook = new ABCJS.TuneBook(abcCode)

            if (tuneBook.tunes.length >= 2) {
                select.innerHTML = ""
                var option = document.createElement("option");
                var optionContent = document.createTextNode("-- select tune --");
                option.appendChild(optionContent);
                option.setAttribute('value', -1)
                select.appendChild(option)
                for (var i = 0; i < tuneBook.tunes.length; i++) {
                    option = document.createElement("option");
                    optionContent = document.createTextNode(tuneBook.tunes[i].title);
                    option.appendChild(optionContent);
                    option.setAttribute('value', i)
                    select.appendChild(option)
                }
                select.value = options.startingTune;
                document.getElementById("tune-selector").style.display = "block"
            } else {
                document.getElementById("tune-selector").style.display = "none"
                options.startingTune = 0
            }
        }

        function clickListener(abcElem, tuneNumber, classes) {
            playNote(abcElem, visualObj.millisecondsPerMeasure());

            vscode.postMessage({
                name: 'click',
                //abcElem: abcElem,
                startChar: abcElem.startChar,
                endChar: abcElem.endChar,
                tuneNumber: tuneNumber,
                classes: classes
            })
        }

        function CursorControl() {
            var self = this;

            self.onReady = function () {
            };
            self.onStart = function () {
                var svg = document.querySelector("#paper svg");
                var cursor = document.createElementNS("http://www.w3.org/2000/svg", "line");
                cursor.setAttribute("class", "abcjs-cursor");
                cursor.setAttributeNS(null, 'x1', 0);
                cursor.setAttributeNS(null, 'y1', 0);
                cursor.setAttributeNS(null, 'x2', 0);
                cursor.setAttributeNS(null, 'y2', 0);
                svg.appendChild(cursor);

            };
            self.beatSubdivisions = 2;
            self.onBeat = function (beatNumber, totalBeats, totalTime) {
            };
            self.onEvent = function (ev) {
                if (ev.measureStart && ev.left === null)
                    return;

                var lastSelection = document.querySelectorAll("#paper svg .highlight");
                for (var k = 0; k < lastSelection.length; k++)
                    lastSelection[k].classList.remove("highlight");

                for (var i = 0; i < ev.elements.length; i++) {
                    var note = ev.elements[i];
                    for (var j = 0; j < note.length; j++) {
                        note[j].classList.add("highlight");
                    }
                }

                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor) {
                    cursor.setAttribute("x1", ev.left - 2);
                    cursor.setAttribute("x2", ev.left - 2);
                    cursor.setAttribute("y1", ev.top);
                    cursor.setAttribute("y2", ev.top + ev.height);
                }
            };
            self.onFinished = function () {
                var els = document.querySelectorAll("svg .highlight");
                for (var i = 0; i < els.length; i++) {
                    els[i].classList.remove("highlight");
                }
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor) {
                    cursor.setAttribute("x1", 0);
                    cursor.setAttribute("x2", 0);
                    cursor.setAttribute("y1", 0);
                    cursor.setAttribute("y2", 0);
                }
            };
        }

        var cursorControl = new CursorControl();
        var synthControl;

        function createSynthControl() {
            if (options.audioEnabled === false) {
                return
            }
            if (!ABCJS.synth.supportsAudio()) {
                return
            }
            if (synthControl) {
                return
            }

            synthControl = new ABCJS.synth.SynthController();
            synthControl.load("#audio", cursorControl, {
                displayLoop: true,
                displayRestart: true,
                displayPlay: true,
                displayProgress: true,
                displayWarp: true
            });
        }

        function load() {
            applyAudioOptions();
            createSynthControl();
            setTune(false);
        }

        window.addEventListener('message', event => {
            const message = event.data; // The JSON data our extension sent

            switch (message.command) {
                case 'contentChange':
                    if (abc !== message.content) {
                        abc = message.content;
                        analyzeContent(abc);
                        reload();
                    }
                    break;

                case 'configurationChange':
                    options = Object.assign({}, defaultOptions, message.content);
                    reload();
                    break;

                case 'requestSvg':
                    // Send the current rendering to the Editor.
                    const svg = document.querySelectorAll('#paper svg')[0];
                    const svgString = svg.outerHTML;

                    vscode.postMessage({
                        name: 'svgExport',
                        content: svgString
                    });
                    break
            }
        });

        document.addEventListener('DOMContentLoaded', function (event) {
            var optionEls = document.querySelectorAll(".option");
            for (var i = 0; i < optionEls.length; i++) {
                document.addEventListener("change", optionChanged);
            }

            analyzeContent(abc);
            load();
        });
    </script>
</body>

</html>
